[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceover"
version = "0.1.0"
description = "Generate audiobooks and long-form narration from text and markdown files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "edge-tts>=7.0",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]
clone = ["chatterbox-tts>=0.1"]

[project.scripts]
voiceover = "voiceover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
